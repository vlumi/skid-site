<header class="site-head">
  <a class="brand" href="/">
    <span class="brand-mark" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 8 8">
        <rect width="8" height="8" fill="var(--kerb-white)"/>
        <g fill="var(--asphalt-deep)">
          <!-- 8×8 checker: a dark cell wherever (col + row) is even -->
          <rect x="0" y="0" width="1" height="1"/><rect x="2" y="0" width="1" height="1"/><rect x="4" y="0" width="1" height="1"/><rect x="6" y="0" width="1" height="1"/>
          <rect x="1" y="1" width="1" height="1"/><rect x="3" y="1" width="1" height="1"/><rect x="5" y="1" width="1" height="1"/><rect x="7" y="1" width="1" height="1"/>
          <rect x="0" y="2" width="1" height="1"/><rect x="2" y="2" width="1" height="1"/><rect x="4" y="2" width="1" height="1"/><rect x="6" y="2" width="1" height="1"/>
          <rect x="1" y="3" width="1" height="1"/><rect x="3" y="3" width="1" height="1"/><rect x="5" y="3" width="1" height="1"/><rect x="7" y="3" width="1" height="1"/>
          <rect x="0" y="4" width="1" height="1"/><rect x="2" y="4" width="1" height="1"/><rect x="4" y="4" width="1" height="1"/><rect x="6" y="4" width="1" height="1"/>
          <rect x="1" y="5" width="1" height="1"/><rect x="3" y="5" width="1" height="1"/><rect x="5" y="5" width="1" height="1"/><rect x="7" y="5" width="1" height="1"/>
          <rect x="0" y="6" width="1" height="1"/><rect x="2" y="6" width="1" height="1"/><rect x="4" y="6" width="1" height="1"/><rect x="6" y="6" width="1" height="1"/>
          <rect x="1" y="7" width="1" height="1"/><rect x="3" y="7" width="1" height="1"/><rect x="5" y="7" width="1" height="1"/><rect x="7" y="7" width="1" height="1"/>
        </g>
      </svg>
    </span>
    <span class="brand-name">Skid Jam</span>
  </a>
  <nav class="site-nav">
    {{ range .Site.Menus.main }}
      <a href="{{ .PageRef | relLangURL }}">{{ .Name }}</a>
    {{ end }}
  </nav>
</header>
