<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#14161a"/>
  <!-- a skid mark curving into a checkered-flag corner -->
  <path d="M6 26 Q8 13 19 10" fill="none" stroke="#e2231a" stroke-width="3"
        stroke-linecap="round" opacity="0.9"/>
  <!-- 4×4 checker patch in the top-right: white ground + alternating dark -->
  <rect x="16" y="6" width="12" height="12" fill="#f4f4f0"/>
  <g fill="#14161a">
    <rect x="16" y="6" width="3" height="3"/><rect x="22" y="6" width="3" height="3"/>
    <rect x="19" y="9" width="3" height="3"/><rect x="25" y="9" width="3" height="3"/>
    <rect x="16" y="12" width="3" height="3"/><rect x="22" y="12" width="3" height="3"/>
    <rect x="19" y="15" width="3" height="3"/><rect x="25" y="15" width="3" height="3"/>
  </g>
</svg>
